# Dokploy / Nixpacks build for the Accounting API (default nixpacks.toml).
# Build context MUST be the repository root (it holds package.json workspaces).
# In Dokploy (API app): Build Type = Nixpacks, Root Directory = empty, leave
# Install/Build/Start empty so this file is honoured.
# Web SPA uses a separate Dokploy app + nixpacks.web.toml (see README).
# The API lives in an npm workspace; plain `npm i` re-resolves the private
# workspace package (@exceledge/accounting-domain) against the public
# registry and 404s. `npm ci` honours package-lock.json workspace links.
providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "24"

[phases.setup]
nixPkgs = ["nodejs_24", "npm-11_x", "openssl"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build -w @exceledge/accounting-domain && npm run build -w @exceledge/accounting-api"]

[start]
cmd = "npm run start -w @exceledge/accounting-api"
