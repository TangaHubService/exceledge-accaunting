# Dokploy / Nixpacks build for the Accounting API.
# Build context MUST be the repository root (it holds package.json workspaces).
# In Dokploy: Build Provider = NIXPACKS, Root Directory = empty, and leave
# Install/Build/Start commands empty so this file is honoured.
# The API lives in an npm workspace; plain `npm i` re-resolves the private
# workspace package (@exceledge/accounting-domain) against the public
# registry and 404s. `npm ci` honours package-lock.json workspace links.
providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "20"

[phases.setup]
nixPkgs = ["nodejs_20", "npm-10_x", "openssl"]

[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
