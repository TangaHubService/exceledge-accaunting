# Dokploy: Build Type = Nixpacks, Root Directory = frontend
providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "20"

[phases.setup]
nixPkgs = ["nodejs_20", "npm-10_x", "openssl"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
# -s (single-page mode): unknown paths get index.html so a refresh on /accounting/... loads the app instead of a 404.
cmd = "npx serve -s dist -l 3000"
